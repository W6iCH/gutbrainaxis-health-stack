{% extends "base.html" %}
{% block title %}运动数据{% endblock %}
{% block content %}
<div class="page-header">
    <h1>运动数据中心</h1>
    <p class="page-subtitle">学生运动打卡记录与统计分析</p>
</div>

<div class="stat-cards" id="exCards">
    <div class="stat-card">
        <div class="stat-label">运动记录总数</div>
        <div class="stat-value" id="statTotal">--</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">参与学生</div>
        <div class="stat-value" id="statStudents">--</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">平均步行天数</div>
        <div class="stat-value" id="statAvgWalk">--</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">数据日期范围</div>
        <div class="stat-value" id="statDateRange">--</div>
    </div>
</div>

<div class="grid-2">
    <div class="card">
        <div class="card-header"><h3>每日运动提交趋势</h3></div>
        <div class="card-body"><canvas id="trendChart" height="250"></canvas></div>
    </div>
    <div class="card">
        <div class="card-header"><h3>学生运动提交排行</h3></div>
        <div class="card-body" style="max-height:300px;overflow-y:auto;">
            <table class="data-table" id="rankTable">
                <thead><tr><th>排名</th><th>学号</th><th>姓名</th><th>提交次数</th></tr></thead>
                <tbody><tr><td colspan="4">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="card" style="margin-top:20px;">
    <div class="card-header">
        <h3>运动记录明细</h3>
        <div class="header-actions">
            <input type="text" id="searchInput" placeholder="搜索学号或姓名..." style="padding:6px 12px;border:1px solid #ddd;border-radius:4px;width:200px;">
            <button onclick="loadList(1)" class="btn btn-sm">搜索</button>
        </div>
    </div>
    <div class="card-body" style="overflow-x:auto;">
        <table class="data-table" id="dataTable">
            <thead>
                <tr>
                    <th>ID</th><th>学号</th><th>姓名</th><th>提交时间</th>
                    <th>步行天数</th><th>步行分钟/天</th><th>久坐小时/天</th>
                    <th>运动详情</th><th>学院</th>
                </tr>
            </thead>
            <tbody id="tableBody"><tr><td colspan="9">加载中...</td></tr></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let currentPage = 1;

fetch('/api/exercise/summary').then(r=>r.json()).then(d => {
    document.getElementById('statTotal').textContent = d.total;
    document.getElementById('statStudents').textContent = d.students;
    document.getElementById('statAvgWalk').textContent = d.avg_walk_days + ' 天/周';
    document.getElementById('statDateRange').textContent = (d.date_start||'--') + ' ~ ' + (d.date_end||'--');
});

fetch('/api/exercise/trend').then(r=>r.json()).then(d => {
    new Chart(document.getElementById('trendChart'), {
        type:'line',
        data:{labels:d.map(x=>x.date),datasets:[{label:'运动提交数',data:d.map(x=>x.count),borderColor:'#3498db',fill:false,tension:0.3}]},
        options:{scales:{y:{beginAtZero:true}}}
    });
});

fetch('/api/exercise/student_distribution').then(r=>r.json()).then(d => {
    const tbody = document.getElementById('rankTable').querySelector('tbody');
    tbody.innerHTML = d.slice(0,30).map((r,i) => `<tr><td>${i+1}</td><td>${r.student_id}</td><td>${r.name}</td><td>${r.count}</td></tr>`).join('');
});

function loadList(page) {
    currentPage = page;
    const keyword = document.getElementById('searchInput').value;
    fetch(`/api/exercise/list?page=${page}&keyword=${encodeURIComponent(keyword)}`)
        .then(r=>r.json()).then(d => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = d.rows.map(r => {
                const exDetail = r.exercises && r.exercises.length > 0
                    ? r.exercises.map(e => `${e.name}: ${e.times_per_week}次×${e.duration_hours}h`).join('; ')
                    : '无';
                return `<tr>
                    <td>${r.id}</td><td>${r.student_id}</td><td>${r.name}</td>
                    <td>${r.submitted_at}</td><td>${r.walk_days}</td>
                    <td>${r.walk_minutes}</td><td>${r.sedentary_hours}</td>
                    <td style="font-size:12px;">${exDetail}</td><td>${r.organization}</td>
                </tr>`;
            }).join('');
            // Pagination
            const totalPages = Math.ceil(d.total / d.per_page);
            let pg = '';
            for (let i = 1; i <= totalPages; i++) {
                pg += `<button class="btn btn-sm ${i===page?'btn-active':''}" onclick="loadList(${i})">${i}</button>`;
            }
            document.getElementById('pagination').innerHTML = pg;
        });
}

document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key==='Enter') loadList(1); });
loadList(1);
</script>
{% endblock %}
