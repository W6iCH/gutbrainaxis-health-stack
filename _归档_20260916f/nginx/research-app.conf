# ── 数据看板 data.example.com → :8090 ─────────────────────────
server {
    listen 80;
    server_name data.example.com;
    access_log __LOG_DIR__/data.access.log;
    error_log  __LOG_DIR__/data.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 裸域跳转 example.com → www ───────────────────────────────
server {
    listen 80;
    server_name example.com;
    return 301 http://www.example.com$request_uri;
}

# ── www 站点 www.example.com → :8080 ──────────────────────────
server {
    listen 80;
    server_name www.example.com;
    access_log __LOG_DIR__/www.access.log;
    error_log  __LOG_DIR__/www.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

