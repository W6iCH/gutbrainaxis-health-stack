# ============================================================================
#  个性化饮食干预课题 — Nginx 站点模板
#  占位符: __LOG_DIR__ → install.sh 自动替换为 /var/log/nginx
#  安装:  sudo ln -sf /etc/nginx/sites-available/research-app.conf \
#                     /etc/nginx/sites-enabled/research-app.conf
# ============================================================================
server_names_hash_bucket_size 64;
client_max_body_size 10M;

# ── 子域名映射 ──────────────────────────────────────────────────────────
#  server_name 与域名需根据实际 DNS 配置修改。
#  默认以 gutbrainaxis.online 为示例；部署时替换为真实域名。
#  DNS 要求：所有子域名 A 记录指向服务器 IP。
# ──────────────────────────────────────────────────────────────────────────

# ── 管理控制台 admin.gutbrainaxis.online → :9000 ──────────────────────
server {
    listen 80;
    server_name admin.gutbrainaxis.online;
    access_log __LOG_DIR__/admin.access.log;
    error_log  __LOG_DIR__/admin.error.log;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API 服务 api.gutbrainaxis.online → :8000（问卷反馈）──────────────
server {
    listen 80;
    server_name api.gutbrainaxis.online;
    access_log __LOG_DIR__/api.access.log;
    error_log  __LOG_DIR__/api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Service 服务 svc.gutbrainaxis.online → :8001（饮食反馈）──────────
server {
    listen 80;
    server_name svc.gutbrainaxis.online;
