    listen 80;
    server_name tools.gutbrainaxis.online;
    access_log __LOG_DIR__/tools.access.log;
    error_log  __LOG_DIR__/tools.error.log;

    location / {
        proxy_pass http://127.0.0.1:9876;
        proxy_set_header Host $host;
